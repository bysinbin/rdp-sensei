<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Rdp Sensei</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Left Sidebar (macOS Windows App Replica) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="traffic-lights">
          <div class="traffic-light close" onclick="window.close()" title="Close"></div>
          <div class="traffic-light min" title="Minimize"></div>
          <div class="traffic-light max" title="Maximize"></div>
        </div>
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Toggle Sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-item active" data-tab="favorites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          <span>Favorites</span>
        </div>
        <div class="nav-item" data-tab="devices">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span>Devices</span>
        </div>
        <div class="nav-item" data-tab="apps">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Apps</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-weight: 600; color: #fff; font-size: 12px;">Rdp Sensei</span>
          <span style="font-size: 10px; color: var(--text-muted);">v1.0 • Pure Go</span>
        </div>
        <span class="engine-pill">WASM</span>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Header Toolbar -->
      <header class="top-bar">
        <div class="top-bar-left">
          <button class="sidebar-show-btn" id="sidebarShowBtn" title="Show Sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </button>
          <h1 class="view-title" id="viewTitle">Favorites</h1>
        </div>

        <div class="top-bar-right">
          <button class="icon-btn" id="addPcBtn" title="Add PC Connection">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>

          <button class="icon-btn" id="pingAllBtn" title="Ping All Hosts">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
            </svg>
          </button>

          <div class="view-switchers">
            <button class="icon-btn active" id="viewGridBtn" title="Grid View">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
            </button>
            <button class="icon-btn" id="viewListBtn" title="List View">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
              </svg>
            </button>
          </div>

          <button class="icon-btn" id="sortBtn" title="Sort Order">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
          </button>

          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Search" autocomplete="off" spellcheck="false" />
          </div>
        </div>
      </header>

      <!-- Scrollable Main View Container -->
      <div class="content-body" id="contentContainer">
        <!-- Rendered dynamically by app.js -->
      </div>

      <!-- Active Sessions Floating Dock Banner (when background sessions are live) -->
      <div class="active-sessions-banner" id="activeSessionsBanner" style="display: none;">
        <span class="active-pulse-dot"></span>
        <div class="active-banner-info">
          <span id="activeSessionsCount">1 Active Session</span>
        </div>
        <div class="active-sessions-chips" id="activeSessionsChips"></div>
        <button class="btn btn-primary" id="resumeSessionBtn" style="padding: 5px 14px; font-size: 12px; border-radius: 14px;">
          View Sessions &rarr;
        </button>
      </div>
    </main>
  </div>

  <!-- In-App RDP Session Container (Zero plugins, pure WebAssembly Canvas) -->
  <div class="rdp-session-view" id="rdpSessionView">
    <!-- Multi-Session Tab Bar -->
    <div class="session-tab-bar" id="sessionTabBar">
      <button class="home-tab-btn" id="sessionCatalogBtn" title="Back to PCs Catalog (Connections stay alive)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        <span>PCs</span>
      </button>
      <div class="session-tabs-list" id="sessionTabsList">
        <!-- Active session tabs rendered here dynamically -->
      </div>
      <button class="session-tab-add-btn" id="sessionAddConnectionBtn" title="Connect to another PC">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Connect PC</span>
      </button>
    </div>

    <!-- Floating Session Control Bar -->
    <div class="session-floating-bar" id="sessionFloatingBar">
      <div class="session-info">
        <span class="session-pc-name" id="sessionPcName">Remote PC</span>
        <span class="session-status-badge" id="sessionStatusBadge">Connecting...</span>
      </div>
      <div class="session-actions">
        <button class="session-btn" id="sessionTouchbarBtn" title="Toggle Virtual Touch Bar (F1-F12, Del, Home, End)">
          <span>⌨️ Touch Bar</span>
        </button>
        <button class="session-btn" id="sessionAltTabBtn" title="Send Alt+Tab to Switch Windows (or press Option+Tab)">
          <span>⇥ Alt+Tab</span>
        </button>
        <button class="session-btn" id="sessionCadBtn" title="Send Ctrl+Alt+Del">
          <span>Ctrl+Alt+Del</span>
        </button>
        <button class="session-btn" id="sessionWinKeyBtn" title="Send Windows Key">
          <span>Win Key</span>
        </button>
        <button class="session-btn" id="sessionFitBtn" title="Toggle Fit to Screen / 1:1 Pixel">
          <span>⛶ Fit Mode</span>
        </button>
        <button class="session-btn" id="sessionClipboardBtn" title="Synchronize Clipboard">
          <span>Sync Clip</span>
        </button>
        <button class="session-btn" id="sessionPopoutBtn" title="Open this session in a new standalone window">
          <span>↗ Pop-out</span>
        </button>
        <button class="session-btn" id="sessionFullscreenBtn" title="Toggle Fullscreen">
          <span>Fullscreen</span>
        </button>
        <button class="session-btn disconnect" id="sessionDisconnectBtn" title="Disconnect Session">
          <span>Disconnect</span>
        </button>
      </div>
    </div>

    <!-- Session Error Banner / Reconnect overlay -->
    <div class="session-error-overlay" id="sessionErrorOverlay" style="display: none;">
      <div class="session-error-card">
        <div style="font-size: 28px; margin-bottom: 8px;">⚠️</div>
        <h3 id="sessionErrorTitle" style="margin-bottom: 6px; font-size: 16px;">Connection Failed</h3>
        <p id="sessionErrorMessage" style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.4;">
          The remote desktop session ended.
        </p>
        <div style="display: flex; gap: 10px; justify-content: center;">
          <button class="btn btn-secondary" onclick="closeSessionView()">Return to PCs</button>
          <button class="btn btn-primary" id="sessionRetryBtn">Enter Credentials &amp; Retry</button>
        </div>
      </div>
    </div>

    <!-- Dynamic Session Viewports Container (One pane per active session) -->
    <div class="session-viewports-container" id="sessionPanesContainer">
      <!-- Session Panes rendered here dynamically -->
    </div>

    <!-- Virtual Touch Bar Strip (MacBook style function and navigation bar) -->
    <div class="touchbar-strip" id="touchbarStrip">
      <!-- Function Keys -->
      <div class="touchbar-group">
        <button class="touchbar-key danger" onclick="window.rdpEngine.sendKey('Escape')">Esc</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('F1')">F1</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('F2')">F2</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('F3')">F3</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('F4')">F4</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('F5')">F5</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('F6')">F6</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('F7')">F7</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('F8')">F8</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('F9')">F9</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('F10')">F10</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('F11')">F11</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('F12')">F12</button>
      </div>

      <div class="touchbar-divider"></div>

      <!-- Navigation & Editing Keys -->
      <div class="touchbar-group">
        <button class="touchbar-key danger" onclick="window.rdpEngine.sendKey('Delete')">Del</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('Home')">Home</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('End')">End</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('PageUp')">PgUp</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('PageDown')">PgDn</button>
        <button class="touchbar-key" onclick="window.rdpEngine.sendKey('Insert')">Ins</button>
      </div>

      <div class="touchbar-divider"></div>

      <!-- Windows & System Controls -->
      <div class="touchbar-group">
        <button class="touchbar-key accent" onclick="window.rdpEngine.sendKey('PrintScreen')">PrtSc</button>
        <button class="touchbar-key accent" onclick="window.rdpEngine.sendAltTab()">⇥ Alt+Tab</button>
        <button class="touchbar-key accent" onclick="window.rdpEngine.sendWindowsKey()">⊞ Win</button>
        <button class="touchbar-key danger" onclick="window.rdpEngine.sendCtrlAltDel()">Ctrl+Alt+Del</button>
      </div>
    </div>
  </div>

  <!-- Interactive Credentials Prompt Modal -->
  <div class="modal-overlay" id="passwordModal">
    <div class="modal-dialog" style="width: 400px;">
      <div class="modal-header">
        <h2 class="modal-title">Enter User Account</h2>
        <button class="modal-close-btn" onclick="closePasswordModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 10px;">
          Enter credentials to connect to <strong id="promptPcName" style="color: #fff;"></strong> (<span id="promptPcHost"></span>):
        </p>
        <input type="hidden" id="promptDeviceId" />
        <div class="form-group">
          <label class="form-label" for="promptUsername">User Account</label>
          <input type="text" class="form-input" id="promptUsername" placeholder="e.g. Ulmo or administrator" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other" />
        </div>
        <div class="form-group">
          <label class="form-label" for="promptPassword">Password</label>
          <input type="password" class="form-input" id="promptPassword" placeholder="••••••••" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other" />
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="promptSavePassword" checked />
            <span>Remember this password</span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closePasswordModal()">Cancel</button>
        <button class="btn btn-primary" id="promptConnectBtn">Connect</button>
      </div>
    </div>
  </div>

  <!-- Add / Edit PC Modal Dialog -->
  <div class="modal-overlay" id="deviceModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add PC Connection</h2>
        <button class="modal-close-btn" id="modalCloseBtn">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="devId" />
        
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="devName">PC Name / Label *</label>
            <input type="text" class="form-input" id="devName" placeholder="e.g. sener mes test" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="devGroup">Group / Folder</label>
            <input type="text" class="form-input" id="devGroup" list="groupSuggestions" placeholder="e.g. sener, bfs, oem" />
            <datalist id="groupSuggestions">
              <option value="arsen">
              <option value="bfs">
              <option value="byb">
              <option value="ev">
              <option value="hk">
              <option value="ideteks">
              <option value="oem">
              <option value="okks">
              <option value="Saved Devices">
              <option value="sener">
            </datalist>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group" style="flex: 2;">
            <label class="form-label" for="devHost">Host / IP Address *</label>
            <input type="text" class="form-input" id="devHost" placeholder="192.168.1.100 or server.local" required />
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label" for="devPort">Port</label>
            <input type="number" class="form-input" id="devPort" value="3389" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="devUsername">User Account</label>
            <input type="text" class="form-input" id="devUsername" placeholder="administrator or user" />
          </div>
          <div class="form-group">
            <label class="form-label" for="devDomain">Domain (Optional)</label>
            <input type="text" class="form-input" id="devDomain" placeholder="DOMAIN" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="devPassword">Password</label>
          <input type="password" class="form-input" id="devPassword" placeholder="••••••••" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="devWidth">Width (px)</label>
            <input type="number" class="form-input" id="devWidth" value="1440" />
          </div>
          <div class="form-group">
            <label class="form-label" for="devHeight">Height (px)</label>
            <input type="number" class="form-input" id="devHeight" value="900" />
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
          <label class="checkbox-label">
            <input type="checkbox" id="devSwapAltMeta" checked />
            <span>Swap Option/Alt with Command (Recommended for Mac keyboards)</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="devEnableAudio" checked />
            <span>Enable Remote Audio Streaming (RDPSND)</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="devFavorite" />
            <span>Add to Favorites ⭐</span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modalCancelBtn">Cancel</button>
        <button class="btn btn-primary" id="modalSaveBtn">Save Connection</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="/js/wasm_exec.js"></script>
  <script src="/js/rdp_engine.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
